# ==============================================================================
# config/airflow_local.cfg — Configuración base local para Apache Airflow
# ==============================================================================

[core]
# Deshabilitar carga de DAGs de ejemplo de Airflow
load_examples = False
# No exponer ejemplos
load_default_connections = False
# Ejecutor local
executor = LocalExecutor
# Deshabilitar telemetría anónima
donot_pickle = False

# Autenticación de desarrollo local (SimpleAuthManager)
simple_auth_manager_all_admins = True
simple_auth_manager_users = admin:admin
simple_auth_manager_passwords_file = %(AIRFLOW_HOME)s/simple_auth_manager_passwords.json

[webserver]
# Puerto web local (Airflow 2.x)
web_server_port = 9179
base_url = http://127.0.0.1:9179

[api]
# Puerto y host para Airflow API / FastAPI (Airflow 2.10+ / 3.x)
host = 127.0.0.1
port = 9179
base_url = http://127.0.0.1:9179

[api_fastapi]
# Configuración para autenticación simple de desarrollo
auth_manager = airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager

[scheduler]
# Concurrencia controlada para entornos de desarrollo local
parsing_processes = 2
file_parsing_sort_mode = modified_time

[logging]
# Nivel de log informativo
logging_level = INFO
