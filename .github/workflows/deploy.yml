name: Deploy to Lightsail

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "dags/**"
      - "notebooks/**"
      - "requirements.txt"
      - ".env.example"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy scripts and Airflow to Lightsail
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          script: |
            set -e

            PROJECT_DIR="$HOME/deforestation-alert-etl"
            VENV_DIR="$PROJECT_DIR/venv"
            PYTHON="$VENV_DIR/bin/python"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="${{ github.ref_name }}"

            echo "── Ensuring Python and system dependencies ──"
            sudo apt-get update -qq
            sudo apt-get install -y -qq git build-essential

            if ! command -v python3 &> /dev/null; then
              echo "Installing Python 3.12..."
              sudo apt-get install -y -qq python3.12 python3.12-venv python3.12-dev python3-pip
            else
              PY_VER=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
              echo "Detected Python version: $PY_VER. Installing corresponding python${PY_VER}-venv..."
              sudo apt-get install -y -qq "python${PY_VER}-venv" "python${PY_VER}-dev" python3-pip python3-setuptools || \
              sudo apt-get install -y -qq python3-venv python3-pip
            fi

            echo "── Ensuring project directory and code ──"
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "Project directory does not exist. Cloning $REPO_URL ($BRANCH)..."
              git clone -b "$BRANCH" "$REPO_URL" "$PROJECT_DIR" || git clone "$REPO_URL" "$PROJECT_DIR"
              cd "$PROJECT_DIR"
            else
              echo "Project directory exists. Pulling latest code for $BRANCH..."
              cd "$PROJECT_DIR"
              git fetch origin
              git checkout "$BRANCH" 2>/dev/null || true
              git pull origin "$BRANCH" || git pull origin main || true
            fi

            PIP="$VENV_DIR/bin/pip"

            echo "── Creating or repairing virtualenv if needed ──"
            if [ ! -x "$PYTHON" ] || [ ! -x "$PIP" ]; then
              echo "Virtualenv is missing or incomplete (pip not found). Recreating at $VENV_DIR..."
              rm -rf "$VENV_DIR"
              python3 -m venv "$VENV_DIR"
              if [ ! -x "$PIP" ]; then
                "$PYTHON" -m ensurepip --upgrade 2>/dev/null || true
              fi
            fi

            echo "── Installing dependencies ──"
            "$PYTHON" -m pip install --quiet --upgrade pip
            "$PYTHON" -m pip install --quiet -r requirements.txt
            "$PYTHON" -m pip install --quiet "apache-airflow>=2.8.0,<3.0.0"

            echo "── Writing .env from secrets ──"
            cat > "$PROJECT_DIR/.env" << 'ENVEOF'
            GFW_API_KEY=${{ secrets.GFW_API_KEY }}
            PG_USER=${{ secrets.PG_USER }}
            PG_PASSWORD=${{ secrets.PG_PASSWORD }}
            PG_HOST=${{ secrets.PG_HOST }}
            PG_PORT=${{ secrets.PG_PORT }}
            PG_DB=${{ secrets.PG_DB }}
            S3_BUCKET=${{ secrets.S3_BUCKET }}
            S3_PREFIX=${{ secrets.S3_PREFIX }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            DATA_PROXY_URL=${{ secrets.DATA_PROXY_URL }}
            ENVEOF

            echo "── Configuring Apache Airflow (Port 9179) ──"
            export AIRFLOW_HOME="$HOME/airflow"
            export AIRFLOW__CORE__DAGS_FOLDER="$PROJECT_DIR/dags"
            export AIRFLOW__CORE__LOAD_EXAMPLES="False"
            export AIRFLOW__WEBSERVER__WEB_SERVER_PORT="9179"
            mkdir -p "$AIRFLOW_HOME"

            echo "── Running Airflow DB migrations ──"
            "$PYTHON" -m airflow db migrate 2>/dev/null || "$PYTHON" -m airflow db init 2>/dev/null || true

            echo "── Creating/Updating Airflow Admin User (Jhoan Hurtado) ──"
            "$PYTHON" -m airflow users create \
              --username admin \
              --firstname Jhoan \
              --lastname Hurtado \
              --role Admin \
              --email jhoanezequielh@gmail.com \
              --password admin 2>/dev/null || \
            "$PYTHON" -m airflow users reset-password \
              --username admin \
              --password admin 2>/dev/null || true

            echo "── Setting up systemd services for Airflow ──"
            sudo tee /etc/systemd/system/airflow-webserver.service > /dev/null << 'UNITEOF'
            [Unit]
            Description=Airflow Webserver (Port 9179)
            After=network.target

            [Service]
            User=ubuntu
            Group=ubuntu
            Type=simple
            Environment="AIRFLOW_HOME=/home/ubuntu/airflow"
            Environment="AIRFLOW__CORE__DAGS_FOLDER=/home/ubuntu/deforestation-alert-etl/dags"
            Environment="AIRFLOW__CORE__LOAD_EXAMPLES=False"
            ExecStart=/home/ubuntu/deforestation-alert-etl/venv/bin/airflow webserver -p 9179
            Restart=always
            RestartSec=5s

            [Install]
            WantedBy=multi-user.target
            UNITEOF

            sudo tee /etc/systemd/system/airflow-scheduler.service > /dev/null << 'UNITEOF'
            [Unit]
            Description=Airflow Scheduler
            After=network.target

            [Service]
            User=ubuntu
            Group=ubuntu
            Type=simple
            Environment="AIRFLOW_HOME=/home/ubuntu/airflow"
            Environment="AIRFLOW__CORE__DAGS_FOLDER=/home/ubuntu/deforestation-alert-etl/dags"
            Environment="AIRFLOW__CORE__LOAD_EXAMPLES=False"
            ExecStart=/home/ubuntu/deforestation-alert-etl/venv/bin/airflow scheduler
            Restart=always
            RestartSec=5s

            [Install]
            WantedBy=multi-user.target
            UNITEOF

            sudo systemctl daemon-reload
            sudo systemctl enable airflow-webserver airflow-scheduler
            sudo systemctl restart airflow-webserver airflow-scheduler

            echo "── Installing cron job fallback ──"
            CRON_CMD="0 22 * * * $PYTHON $PROJECT_DIR/scripts/batch_download.py >> $HOME/logs/batch.log 2>&1"
            mkdir -p "$HOME/logs"
            ( crontab -l 2>/dev/null | grep -v "batch_download.py"; echo "$CRON_CMD" ) | crontab -

            echo "✅ Deploy and Airflow setup complete"

  verify:
    name: Verify deployment and Airflow services
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Check scripts and Airflow services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          script: |
            PROJECT_DIR="$HOME/deforestation-alert-etl"
            PYTHON="$PROJECT_DIR/venv/bin/python"

            echo "── Python version ──"
            "$PYTHON" --version

            echo "── Checking imports ──"
            "$PYTHON" -c "import requests, boto3, pandas, sqlalchemy, airflow; print('All imports OK')"

            echo "── Checking Airflow Services ──"
            sudo systemctl is-active airflow-webserver && echo "airflow-webserver: ACTIVE" || echo "airflow-webserver: INACTIVE"
            sudo systemctl is-active airflow-scheduler && echo "airflow-scheduler: ACTIVE" || echo "airflow-scheduler: INACTIVE"

            echo "── Checking Port 9179 Listening ──"
            sudo ss -tulpn | grep 9179 || echo "Waiting for port 9179 to bind..."

