name: Deploy to Lightsail

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "dags/**"
      - "notebooks/**"
      - "config/**"
      - "requirements.txt"
      - ".env.example"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy scripts and Airflow to Lightsail
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          script: |
            set -e

            PROJECT_DIR="$HOME/deforestation-alert-etl"
            VENV_DIR="$PROJECT_DIR/venv"
            PYTHON="$VENV_DIR/bin/python"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="${{ github.ref_name }}"

            echo "── Ensuring Python and system dependencies ──"
            sudo apt-get update -qq
            sudo apt-get install -y -qq git build-essential

            if ! command -v python3 &> /dev/null; then
              echo "Installing Python 3.12..."
              sudo apt-get install -y -qq python3.12 python3.12-venv python3.12-dev python3-pip
            else
              PY_VER=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
              echo "Detected Python version: $PY_VER. Installing corresponding python${PY_VER}-venv..."
              sudo apt-get install -y -qq "python${PY_VER}-venv" "python${PY_VER}-dev" python3-pip python3-setuptools || \
              sudo apt-get install -y -qq python3-venv python3-pip
            fi

            echo "── Ensuring project directory and code ──"
            if [ -d "$PROJECT_DIR" ]; then
              sudo chown -R ubuntu:ubuntu "$PROJECT_DIR"
            fi

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "Project directory does not exist. Cloning $REPO_URL ($BRANCH)..."
              git clone -b "$BRANCH" "$REPO_URL" "$PROJECT_DIR" || git clone "$REPO_URL" "$PROJECT_DIR"
              cd "$PROJECT_DIR"
            else
              echo "Project directory exists. Pulling latest code for $BRANCH..."
              cd "$PROJECT_DIR"
              git fetch origin
              git checkout "$BRANCH" 2>/dev/null || true
              git pull origin "$BRANCH" || git pull origin main || true
            fi

            PIP="$VENV_DIR/bin/pip"

            echo "── Creating or repairing virtualenv if needed ──"
            # Si el venv tiene residuos de airflow 2 o no tiene airflow 3, recrearlo limpio
            if [ -x "$PYTHON" ]; then
              if "$PYTHON" -c "import airflow; assert airflow.__version__.startswith('3')" 2>/dev/null; then
                echo "Airflow 3.x already installed in virtualenv."
              else
                echo "Virtualenv contains old Airflow or is corrupted. Recreating cleanly for Airflow 3..."
                rm -rf "$VENV_DIR"
              fi
            fi

            if [ ! -x "$PYTHON" ] || [ ! -x "$PIP" ]; then
              echo "Virtualenv is missing or incomplete (pip not found). Recreating at $VENV_DIR..."
              rm -rf "$VENV_DIR"
              python3 -m venv "$VENV_DIR"
              if [ ! -x "$PIP" ]; then
                "$PYTHON" -m ensurepip --upgrade 2>/dev/null || true
              fi
            fi

            echo "── Installing dependencies (Airflow 3 & ETL) ──"
            "$PYTHON" -m pip install --quiet --upgrade pip
            "$PYTHON" -m pip install -r requirements.txt

            echo "── Writing .env from secrets ──"
            cat > "$PROJECT_DIR/.env" << 'ENVEOF'
            GFW_API_KEY=${{ secrets.GFW_API_KEY }}
            PG_USER=${{ secrets.PG_USER }}
            PG_PASSWORD=${{ secrets.PG_PASSWORD }}
            PG_HOST=${{ secrets.PG_HOST }}
            PG_PORT=${{ secrets.PG_PORT }}
            PG_DB=${{ secrets.PG_DB }}
            S3_BUCKET=${{ secrets.S3_BUCKET }}
            S3_PREFIX=${{ secrets.S3_PREFIX }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            DATA_PROXY_URL=${{ secrets.DATA_PROXY_URL }}
            ENVEOF

            echo "── Configuring Apache Airflow 3 (Port 9179) ──"
            export AIRFLOW_HOME="$HOME/airflow"
            export AIRFLOW__CORE__DAGS_FOLDER="$PROJECT_DIR/dags"
            export AIRFLOW__CORE__LOAD_EXAMPLES="False"
            export AIRFLOW__WEBSERVER__WEB_SERVER_PORT="9179"
            export AIRFLOW__API__PORT="9179"
            export AIRFLOW__API__HOST="0.0.0.0"
            export AIRFLOW__API__BASE_URL="http://127.0.0.1:9179"
            export AIRFLOW__CORE__EXECUTION_API_SERVER_URL="http://127.0.0.1:9179/execution/"
            export AIRFLOW__API_AUTH__JWT_SECRET="defor_etl_jwt_secret_key_fixed_token_2026_secure"
            mkdir -p "$AIRFLOW_HOME"

            # Enlazar la carpeta de DAGs para que siempre sea encontrada
            ln -sfn "$PROJECT_DIR/dags" "$AIRFLOW_HOME/dags"

            # Copiar configuración base versionada
            cp "$PROJECT_DIR/config/airflow_local.cfg" "$AIRFLOW_HOME/airflow.cfg"

            # Configurar credenciales SimpleAuthManager y Standalone (admin / admin)
            echo '{"admin": "admin"}' > "$AIRFLOW_HOME/simple_auth_manager_passwords.json"
            echo '{"admin": "admin"}' > "$AIRFLOW_HOME/simple_auth_manager_passwords.json.generated"
            echo "admin" > "$AIRFLOW_HOME/standalone_admin_password.txt"

            # Si existe base de datos heredada de Airflow 2, respaldar para inicialización limpia de Airflow 3
            if [ -f "$AIRFLOW_HOME/airflow.db" ]; then
              if ! "$PYTHON" -c "import sqlite3; conn=sqlite3.connect('$AIRFLOW_HOME/airflow.db'); cur=conn.cursor(); cur.execute('SELECT version_num FROM alembic_version'); v=cur.fetchone(); assert v and 'd2f4e1b3c5a7' in v[0]" 2>/dev/null; then
                echo "Migrating: backing up legacy Airflow 2 db and creating clean Airflow 3 database..."
                mv "$AIRFLOW_HOME/airflow.db" "$AIRFLOW_HOME/airflow.db.old_af2" 2>/dev/null || true
              fi
            fi

            echo "── Running Airflow DB migrations ──"
            "$PYTHON" -m airflow db migrate

            echo "── Stopping legacy Airflow 2 services if active ──"
            sudo systemctl stop airflow-webserver airflow-scheduler 2>/dev/null || true
            sudo systemctl disable airflow-webserver airflow-scheduler 2>/dev/null || true
            sudo rm -f /etc/systemd/system/airflow-webserver.service /etc/systemd/system/airflow-scheduler.service 2>/dev/null || true

            echo "── Setting up unified systemd service for Airflow 3 ──"
            sudo tee /etc/systemd/system/airflow.service > /dev/null << 'UNITEOF'
            [Unit]
            Description=Apache Airflow 3 Standalone (FastAPI API Server & Scheduler Port 9179)
            After=network.target

            [Service]
            User=ubuntu
            Group=ubuntu
            Type=simple
            WorkingDirectory=/home/ubuntu/deforestation-alert-etl
            Environment="PATH=/home/ubuntu/deforestation-alert-etl/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            Environment="AIRFLOW_HOME=/home/ubuntu/airflow"
            Environment="AIRFLOW__CORE__DAGS_FOLDER=/home/ubuntu/deforestation-alert-etl/dags"
            Environment="AIRFLOW__CORE__LOAD_EXAMPLES=False"
            Environment="AIRFLOW__WEBSERVER__WEB_SERVER_PORT=9179"
            Environment="AIRFLOW__API__PORT=9179"
            Environment="AIRFLOW__API__HOST=0.0.0.0"
            Environment="AIRFLOW__API__BASE_URL=http://127.0.0.1:9179"
            Environment="AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://127.0.0.1:9179/execution/"
            Environment="AIRFLOW__API_AUTH__JWT_SECRET=defor_etl_jwt_secret_key_fixed_token_2026_secure"
            Environment="PROJECT_DIR=/home/ubuntu/deforestation-alert-etl"
            ExecStart=/home/ubuntu/deforestation-alert-etl/venv/bin/airflow standalone
            Restart=always
            RestartSec=5s

            [Install]
            WantedBy=multi-user.target
            UNITEOF

            sudo systemctl daemon-reload
            sudo systemctl enable airflow
            sudo systemctl restart airflow

            echo "── Registering & Unpausing DAGs in Airflow ──"
            sleep 5
            "$PYTHON" -m airflow dags list 2>/dev/null || true
            "$PYTHON" -m airflow dags unpause deforestation_etl_dag 2>/dev/null || true

            echo "── Installing cron job fallback ──"
            CRON_CMD="0 22 * * * $PYTHON $PROJECT_DIR/scripts/batch_download.py >> $HOME/logs/batch.log 2>&1"
            mkdir -p "$HOME/logs"
            ( crontab -l 2>/dev/null | grep -v "batch_download.py"; echo "$CRON_CMD" ) | crontab -

            echo "✅ Deploy and Airflow setup complete"

  verify:
    name: Verify deployment and Airflow services
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Check scripts and Airflow services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          script: |
            PROJECT_DIR="$HOME/deforestation-alert-etl"
            PYTHON="$PROJECT_DIR/venv/bin/python"
            export PATH="$PROJECT_DIR/venv/bin:$PATH"
            export AIRFLOW_HOME="$HOME/airflow"
            export AIRFLOW__CORE__DAGS_FOLDER="$PROJECT_DIR/dags"

            echo "── Python version ──"
            "$PYTHON" --version

            echo "── Checking imports ──"
            "$PYTHON" -c "import requests, boto3, pandas, sqlalchemy, airflow; print(f'Airflow version: {airflow.__version__}')"

            echo "── Checking Airflow Service Status ──"
            sudo systemctl is-active airflow && echo "airflow: ACTIVE" || echo "airflow: INACTIVE"

            echo "── Waiting for Port 9179 to bind (up to 30s) ──"
            PORT_READY=false
            for i in $(seq 1 15); do
              if sudo ss -tulpn | grep -q 9179; then
                echo "Port 9179 is active and listening!"
                PORT_READY=true
                break
              fi
              echo "Waiting for port 9179 ($i/15)..."
              sleep 2
            done

            if [ "$PORT_READY" = "false" ]; then
              echo "=== Error: Port 9179 did not bind. Service logs from journalctl ==="
              sudo journalctl -u airflow -n 50 --no-pager || true
              exit 1
            fi

            echo "── Waiting for DAG processor to serialize DAGs ──"
            sleep 5
            echo "── Airflow Loaded DAGs ──"
            "$PYTHON" -m airflow dags list

